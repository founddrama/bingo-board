name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # checkout repo under $GITHUB_WORKSPACE
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: '17.x'

      - name: Get Git short SHA
        id: vars
        run: echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"

      - name: Install packages
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build package for dist
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          echo "Compiling from ${{ steps.vars.outputs.sha_short }}"
          npm run compile

      - name: Extract version
        uses: Saionaro/extract-package-version@v1.0.6
        id: extract-package-version

      - name: Commit dist and tag
        uses: EndBug/add-and-commit@v7
        with:
          add: 'dist'
          branch_mode: create
          message: "Building dist from ${{ steps.vars.outputs.sha_short }} 📦"
          tag: ${{ steps.extract-package-version.outputs.version }}
          push: true

      - name: Ensure release tag exists
        run: |
          VERSION="${{ steps.extract-package-version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null; then
            echo "Tag ${VERSION} already exists on origin, nothing to do."
          else
            echo "Tag ${VERSION} is missing on origin (likely because dist/ had no changes to commit) -- creating it now."
            git tag "${VERSION}"
            git push origin "${VERSION}"
          fi
